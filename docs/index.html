<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate the Joke</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Rate the Joke</h1>
    <div class="top-right">
      <div class="counter" title="Jokes you have rated">
        <span id="count">0</span> rated
      </div>
      <a class="pill" href="stats.html">📊 Stats</a>
    </div>
  </header>

  <main>
    <div id="setup" class="notice" hidden>
      The app is not connected yet: fill in <code>docs/config.js</code>.
    </div>

    <section id="card" class="card" aria-live="polite">
      <p id="joke" class="joke">Loading…</p>
      <div id="reveal" class="reveal" hidden></div>
    </section>

    <p class="question">How funny is it?</p>
    <div id="scale" class="scale" role="group" aria-label="Funniness from 1 to 5">
      <button data-score="1" title="WTF? Not even a joke (1)"><span>🤨</span><small>WTF?</small></button>
      <button data-score="2" title="Meh (2)"><span>😐</span><small>Meh</small></button>
      <button data-score="3" title="Made me smile (3)"><span>😄</span><small>Smile</small></button>
      <button data-score="4" title="Funny (4)"><span>😆</span><small>Funny</small></button>
      <button data-score="5" title="Hilarious (5)"><span>🤣</span><small>Hilarious</small></button>
    </div>
    <div class="actions">
      <button id="skip" class="link">Skip</button>
      <span class="hint">Keys: 1–5, S to skip</span>
    </div>

    <details id="add" class="add">
      <summary>➕ Add your own joke</summary>
      <form id="add-form">
        <textarea id="add-text" maxlength="500" rows="4" required
          placeholder="Your joke (up to 500 characters)"></textarea>
        <div class="add-row">
          <span id="add-len" class="hint">0 / 500</span>
          <button type="submit" class="primary">Submit</button>
        </div>
      </form>
    </details>
  </main>

  <footer><a class="gh" href="https://github.com/ampapacek/joke-generation" target="_blank" rel="noopener">GitHub repo</a></footer>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
