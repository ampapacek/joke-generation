<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joke Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Joke Stats</h1>
    <a class="pill" href="index.html">← Rate jokes</a>
  </header>
  <main>
    <div class="stats-bar">
      <p id="summary" class="summary">Loading…</p>
      <button id="csv" class="pill" hidden>⬇ Download CSV</button>
    </div>
    <table>
      <thead>
        <tr><th>Joke</th><th class="num">Ratings</th><th class="num">Skips</th><th class="num">Avg</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <footer>Best-rated first; jokes without ratings at the bottom. · <a class="gh" href="https://github.com/ampapacek/joke-generation" target="_blank" rel="noopener">GitHub repo</a></footer>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    (async function () {
      const summary = document.getElementById("summary");
      if (!JokesApi.configured) { summary.textContent = "Not connected: fill in docs/config.js."; return; }
      let rows;
      try { rows = await JokesApi.stats(); }
      catch (e) { summary.textContent = "Could not load stats: " + e.message; return; }
      const total = rows.reduce((s, r) => s + Number(r.n_ratings), 0);
      summary.textContent = `${rows.length} jokes, ${total} ratings in total.`;
      rows.sort((a, b) =>
        (b.avg_score == null ? -1 : Number(b.avg_score)) - (a.avg_score == null ? -1 : Number(a.avg_score))
        || Number(b.n_ratings) - Number(a.n_ratings));
      const csvButton = document.getElementById("csv");
      csvButton.hidden = false;
      csvButton.addEventListener("click", () => {
        const esc = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
        const lines = [["id", "joke", "n_ratings", "n_skips", "avg_score"].join(",")];
        for (const r of rows) lines.push([r.id, esc(r.text), r.n_ratings, r.n_skips, r.avg_score ?? ""].join(","));
        // BOM so Excel opens the UTF-8 file correctly
        const blob = new Blob(["\ufeff" + lines.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "joke_ratings_" + new Date().toISOString().slice(0, 10) + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });
      const tbody = document.getElementById("rows");
      for (const r of rows) {
        const tr = document.createElement("tr");
        const cells = [r.text, r.n_ratings, r.n_skips, r.avg_score == null ? "–" : Number(r.avg_score).toFixed(2)];
        cells.forEach((v, i) => {
          const td = document.createElement("td");
          if (i > 0) td.className = "num";
          td.textContent = v;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
    })();
  </script>
</body>
</html>
